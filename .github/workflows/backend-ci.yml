name: Backend CI

# NestJS backend (apps/backend). The legacy Next.js app in apps/_legacy/backend
# is reference-only and is not built here. Every step after checkout is skipped
# until the Nest app is scaffolded (apps/backend/package.json exists).
# See docs/backend-rebuild/01-nestjs-migration-plan.md.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/backend/**'
      - 'packages/pijin_core/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/backend/**'
      - 'packages/pijin_core/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  verify-and-build:
    name: Backend Type Check, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip notice (Nest app not scaffolded yet)
        if: hashFiles('apps/backend/package.json') == ''
        working-directory: .
        run: echo "apps/backend/package.json not found; skipping backend CI."

      - name: Setup Node.js Environment
        if: hashFiles('apps/backend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Monorepo Dependencies
        if: hashFiles('apps/backend/package.json') != ''
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Build HoneBill SDK
        if: hashFiles('apps/backend/package.json') != ''
        working-directory: ./packages/pijin_core
        run: npx tsc

      - name: Validate & Generate Prisma Client
        if: hashFiles('apps/backend/package.json') != ''
        env:
          # A dummy database URL allows Prisma to generate types without a live database
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/dummy"
        run: |
          npx prisma validate
          npx prisma generate

      - name: Strict Type Check
        if: hashFiles('apps/backend/package.json') != ''
        run: npx tsc --noEmit

      - name: Unit Tests
        if: hashFiles('apps/backend/package.json') != ''
        run: npm test --if-present

      - name: Nest Build
        if: hashFiles('apps/backend/package.json') != ''
        run: npm run build
